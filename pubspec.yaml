name: notilus
description: Navigateur futuriste pour développeurs - Notilus Browser
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  
  # State Management
  provider: ^6.1.1
  
  # Storage
  shared_preferences: ^2.2.2
  
  # UI & Animations
  flutter_animate: ^4.3.0
  intl: ^0.19.0
  cached_network_image: ^3.3.1
  image: ^4.1.3
  google_fonts: ^6.1.0
  
  # Terminal
  xterm: ^4.0.0
  process_run: ^0.12.0
  
  # WebView Engine - WebView2 pour Windows (Option #1 - Production-ready)
  webview_windows: ^0.2.0
  
  # Utilities
  uuid: ^4.2.1
  url_launcher: ^6.2.2
  http: ^1.1.0
  path_provider: ^2.1.1
  path: ^1.9.0
  web_socket_channel: ^2.4.0
  crypto: ^3.0.3
  
  # Window Management
  window_manager: ^0.3.7
  
  # File Picker
  file_picker: ^6.1.1
  
  # Firebase
  firebase_core: ^3.6.0
  firebase_auth: ^5.3.1
  cloud_firestore: ^5.4.4
  
  # Auth Providers
  google_sign_in: ^6.1.6
  
  # Markdown (pour documentation)
  flutter_markdown: ^0.6.18
  markdown: ^7.0.0
  
  # Audio
  audioplayers: ^5.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  
  # Assets (to be added later)
  # assets:
  #   - assets/images/
  #   - assets/icons/

