name: notilus
description: Navigateur futuriste pour développeurs - Notilus Browser
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  
  # State Management
  provider: ^6.1.1
  
  # Storage
  shared_preferences: ^2.2.2
  
  # UI & Animations
  flutter_animate: ^4.3.0
  intl: ^0.19.0
  cached_network_image: ^3.3.1
  
  # Terminal
  xterm: ^4.0.0
  process_run: ^0.12.0
  
  # WebView Engine - WebView2 pour Windows (Option #1 - Production-ready)
  webview_windows: ^0.2.0
  
  # Utilities
  uuid: ^4.2.1
  url_launcher: ^6.2.2
  http: ^1.1.0
  
  # Window Management
  window_manager: ^0.3.7

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  
  # Assets (to be added later)
  # assets:
  #   - assets/images/
  #   - assets/icons/

